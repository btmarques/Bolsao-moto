<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#121820; --muted:#5a6573; --line:#d6dbe2;
  --sign:#0b4f9c; --sign-2:#083c78; --sign-fg:#fff; --mark:#f2b705; --mark-fg:#1b1600;
  --pin:#d0142c; --ok:#178a45; --warn:#b26a00; --chip:#e4e9f0; --hdr:#0b4f9c;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1016; --surface:#161c24; --fg:#eef2f6; --muted:#9aa5b2; --line:#29313c;
  --sign:#2f7bd6; --sign-2:#1d5aa6; --chip:#1f2732; --ok:#3cc477; --warn:#f0a43a; --pin:#ff4d5e; --hdr:#0f2744;
  color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0c1016; --surface:#161c24; --fg:#eef2f6; --muted:#9aa5b2; --line:#29313c;
  --sign:#2f7bd6; --sign-2:#1d5aa6; --chip:#1f2732; --ok:#3cc477; --warn:#f0a43a; --pin:#ff4d5e; --hdr:#0f2744;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{height:100dvh;position:relative;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit}
.pad{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* topo */
header{background:var(--hdr);color:var(--sign-fg);padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:12px;flex:none;position:relative;z-index:1000}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cfg{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;padding:0}
#cfg svg{width:26px;height:26px}
#cfg:active{background:rgba(255,255,255,.3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cfgsec{margin:14px 0 4px}
#near{flex:none;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:15px;padding:8px 11px;border-radius:999px;display:flex;align-items:center;gap:6px}
#near:active{background:rgba(255,255,255,.3)}
.search{position:relative}
#q{width:100%;font:inherit;font-size:18px;padding:14px 44px 14px 16px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-appearance:none}
#q:focus{outline:3px solid var(--mark)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;max-height:58vh;overflow-y:auto}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-bottom:1px solid var(--line)}
#sugg button:last-child{border-bottom:0}
#sugg small{display:block;color:var(--muted);font-size:14px}
#sugg .hd{padding:10px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* mapa */
#map{flex:1 1 auto;min-height:200px;background:var(--chip);z-index:1}
.maplibregl-map{font-family:var(--font)}
.maplibregl-ctrl-attrib{font-size:10px}
.mk{cursor:pointer}
.dest-pin{width:30px;height:40px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.bmk{display:grid;place-items:center;border-radius:50%;background:var(--mark);color:var(--mark-fg);font-weight:800;font-size:12px;border:2px solid #1b1600;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bmk{position:relative}
.bmk .ord{position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;background:var(--sign);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.bmk.rt{background:var(--ok);color:#fff;border-color:#fff}
.rnrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.rnrow .lbl{margin:0}
.prem{font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--mark);color:var(--mark-fg);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.seg.rn{margin-bottom:12px}
.bmk.best{background:var(--ok);color:#fff;border-color:#fff;font-size:14px;box-shadow:0 0 0 4px rgba(23,138,69,.35),0 2px 6px rgba(0,0,0,.4)}

#loc{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(var(--sh,46vh) + 14px);z-index:800;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);color:#1a73e8;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;transition:bottom .25s ease}
#loc.on{background:#1a73e8;color:#fff}
@media (min-width:760px){#loc{bottom:24px}}
/* painel */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -6px 24px rgba(0,0,0,.18);z-index:900;padding-bottom:env(safe-area-inset-bottom);height:46vh;display:flex;flex-direction:column;transition:height .25s ease}
#sheet.dragging{transition:none}
.grabzone{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none;margin:0 -16px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line)}
#panel{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px;min-height:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.dest{font-size:15px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.dest b{color:var(--fg)}
.top{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start}
.top h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.15;font-weight:800;overflow-wrap:anywhere;text-wrap:balance}
.top .sub{grid-column:1;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.vg{grid-row:1/span 2;grid-column:2;background:var(--mark);color:var(--mark-fg);border-radius:12px;text-align:center;padding:6px 10px;min-width:64px}
.vg b{display:block;font-size:26px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.vg span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.walk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.pill{font-size:14px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--chip);font-variant-numeric:tabular-nums}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:var(--ok);color:#fff;font-size:20px;font-weight:800;padding:17px;box-shadow:0 4px 14px rgba(23,138,69,.35)}
.go:active{transform:scale(.985)}
.alts{margin-top:16px;display:grid;gap:8px}
.alt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:none;text-align:left;width:100%}
.alt .t{font-weight:650;overflow-wrap:anywhere}
.alt .s{grid-column:1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.alt .n{grid-row:1/span 2;grid-column:2;font-weight:800;font-size:15px;background:var(--chip);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.empty h2{margin:0 0 6px;font-family:var(--display);font-size:22px;font-weight:800}
.empty p{margin:0 0 12px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 12px;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:14px;font-size:12px;color:var(--muted)}
.rowhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
.rowhd .lbl{margin:0}
.favbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.favbtn svg{flex:none;color:var(--mark)}
.favbtn small{font-weight:600;color:var(--muted);font-size:13px}
.back{border:0;background:none;color:var(--sign);font-weight:700;padding:0;margin:0 0 10px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:2000;max-width:calc(100% - 32px);text-align:center}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (min-width:760px){
  body{flex-direction:row;flex-wrap:wrap}
  header{width:100%}
  #map{order:2;flex:1 1 0;height:auto}
  #sheet{position:static;order:1;width:400px;height:auto!important;margin-top:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding-top:14px}
  .grabzone{display:none}
}
</style>
</head>

" y2="31.05" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/><line x1="28.18" y1="22.64" x2="24.00" y2="12.00" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/><circle cx="24" cy="24" r="5.0" fill="currentColor"/><circle cx="24" cy="24" r="1.6" fill="var(--hdr)"/></svg></button><button id="near" aria-label="Bolsões perto de mim"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/></svg>Perto de mim</button></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SP_BBOX=[-46.83,-24.01,-46.36,-23.36];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let B=[];               // bolsões: {lat,lng,vagas,rua,comp,area}
let DATA_DATE='';
let dest=null;          // {lat,lng,label,sub}
let picked=0;           // índice do bolsão escolhido na lista atual
let current=[];         // lista ordenada atual

// ---------- distância ----------
function dist(a,b){const R=6371000,toR=Math.PI/180;const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fmtM=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const walkMin=m=>Math.max(1,Math.round(m*1.3/80)); // fator de trajeto real ≈1,3; 80 m/min

// ---------- mapa ----------
const dark=matchMedia('(prefers-color-scheme: dark)');
const tema=()=>document.documentElement.getAttribute('data-theme')||'auto';
const isDark=()=>tema()==='dark'||(tema()==='auto'&&dark.matches);
const styleUrl=()=>'https://tiles.openfreemap.org/styles/'+(isDark()?'dark':'positron');
const map=new maplibregl.Map({container:'map',style:styleUrl(),center:[-46.6333,-23.5505],zoom:13,attributionControl:{compact:true},pitchWithRotate:false,dragRotate:false});
map.touchZoomRotate.disableRotation();
// marcadores do resultado (elementos HTML, sobrevivem à troca de estilo)
let markers=[];
const layer={clearLayers(){markers.forEach(m=>m.remove());markers=[];setLine(null);setRoute(null)}};
function addMarker(lng,lat,html,anchor,z,onClick){const el=document.createElement('div');el.className='mk';el.innerHTML=html;el.style.zIndex=z||0;
  if(onClick)el.addEventListener('click',e=>{e.stopPropagation();onClick()});
  const m=new maplibregl.Marker({element:el,anchor:anchor||'center'}).setLngLat([lng,lat]).addTo(map);markers.push(m);return m}
const destHtml='<svg class="dest-pin" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25z" fill="#d0142c" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>';
const meHtml='<div class="me-dot"></div>';
const bHtml=(n,best,ord)=>{const s=best?40:ord?32:Math.min(30,18+Math.round(n/5));return `<div class="bmk${best?' best':ord?' rt':''}" style="width:${s}px;height:${s}px">${n}${ord?`<i class="ord">${ord}</i>`:''}</div>`};
// camadas de dados no mapa (refeitas sempre que o estilo carrega)
let lineData=null, routeData=null, allData={type:'FeatureCollection',features:[]}, allVisible=true;
const empty={type:'FeatureCollection',features:[]};
function setRoute(coords){routeData=coords&&coords.length>1?{type:'Feature',geometry:{type:'LineString',coordinates:coords}}:null;const s=map.getSource('rota');if(s)s.setData(routeData||empty)}
function setLine(coords){lineData=coords?{type:'Feature',geometry:{type:'LineString',coordinates:coords}}:null;const s=map.getSource('linha');if(s)s.setData(lineData||empty)}
function setAllVisible(v){allVisible=v;if(map.getLayer('todos'))map.setLayoutProperty('todos','visibility',v?'visible':'none')}
function addDataLayers(){
  if(!map.getSource('todos'))map.addSource('todos',{type:'geojson',data:allData});

// ---------- rotas pelas ruas (OSRM / OpenStreetMap: respeita mão de direção) ----------
const routeCache=new Map();
function osrm(points){const key=points.map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  if(routeCache.has(key))return routeCache.get(key);
  const pr=fetch('https://router.project-osrm.org/route/v1/driving/'+key+'?overview=full&geometries=geojson')
    .then(r=>r.json()).then(j=>j.code==='Ok'&&j.routes[0]?{coords:j.routes[0].geometry.coordinates,dist:j.routes[0].distance,dur:j.routes[0].duration}:null)
    .catch(()=>null);
  routeCache.set(key,pr);pr.then(v=>{if(!v)routeCache.delete(key)});return pr}
// distância de um ponto até a rota e quanto da rota já foi percorrido nesse ponto (metros)
function alongRoute(coords,pt){const kx=111320*Math.cos(pt.lat*Math.PI/180),ky=110540;let best={d:1e9,s:0},acc=0;
  for(let i=1;i<coords.length;i++){const ax=(coords[i-1][0]-pt.lng)*kx,ay=(coords[i-1][1]-pt.lat)*ky,bx=(coords[i][0]-pt.lng)*kx,by=(coords[i][1]-pt.lat)*ky;
    const vx=bx-ax,vy=by-ay,L=Math.hypot(vx,vy)||1e-9;let t=-(ax*vx+ay*vy)/(L*L);t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+vx*t,ay+vy*t);if(d<best.d)best={d,s:acc+L*t};acc+=L}
  return {d:best.d,s:best.s,total:acc}}
// "no meu caminho": bolsões a até 150 m da rota, no último 1,5 km antes do destino, na ordem em que você passa
let pathInfo=null;
function computePath(){
  if(!dest||!lastPos)return;const d=dest,key=d.lat+','+d.lng+'|'+lastPos.lat.toFixed(4)+','+lastPos.lng.toFixed(4)+'|'+routeN;
  if(pathInfo&&pathInfo.key===key)return;pathInfo={key,loading:true};
  osrm([lastPos,d]).then(r=>{if(!pathInfo||pathInfo.key!==key)return;
    if(!r){pathInfo={key,fail:true};render();return}
    const cand=B.filter(b=>dist(d,b)<=1600).map(b=>({b,...alongRoute(r.coords,b)})).filter(x=>x.d<=150&&x.total-x.s<=1500).sort((a,c)=>a.s-c.s);
    pathInfo={key,stops:cand.slice(-routeN).map(x=>x.b)};render(true)})}
// rota passando por 1, 2 ou 3 bolsões (Premium no futuro)
let routeN=store.get('rotaN',1), routeOrd=store.get('rotaOrdem','caminho');
// escolhe os bolsões (o escolhido + os mais próximos dele) e define a ordem de visita
function routeStops(){
  if(routeN>1&&routeOrd==='caminho'&&pathInfo&&pathInfo.stops&&pathInfo.stops.length)return pathInfo.stops;
  const first=current[picked].b, stops=[first], pool=current.filter((x,i)=>i!==picked).map(x=>x.b);
  while(stops.length<routeN&&pool.length){const last=stops[stops.length-1];pool.sort((a,c)=>dist(last,a)-dist(last,c));stops.push(pool.shift())}
  if(routeOrd!=='perto'&&stops.length>1){const rest=stops.slice(1).sort((a,c)=>dist(dest,c)-dist(dest,a));return [...rest,first]}
  return stops}
function render(fit){

  // trecho a pé (tracejado) do bolsão mais perto até o destino; trecho de moto pelas ruas

  if(fit){const bb=new maplibregl.LngLatBounds([d.lng,d.lat],[d.lng,d.lat]);(stops.length>1?stops:current.slice(0,3).map(x=>x.b)).forEach(s=>bb.extend([s.lng,s.lat]));map.fitBounds(bb,{padding:{top:50,left:40,right:40,bottom:(mobile()?Math.min(sheet.offsetHeight,$('map').offsetHeight*.6):0)+40},maxZoom:17,duration:600})}
  const near=c.m<=400, far=c.m>900;
  const where=d.me?'Você está aqui':`Destino: <b>${esc(d.label)}</b>${d.sub?' · '+esc(d.sub):''}`;
  panel.innerHTML=`
  <p class="dest">${where}</p>

  ${routeN>1?`<div class="seg rn" role="group" aria-label="Ordem da rota">

// ---------- abrir no Google Maps ----------
function go(b){
  const ll=b.lat+','+b.lng;
  const web='https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving&dir_action=navigate';
  const app='comgooglemaps://?daddr='+ll+'&directionsmode=driving';
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!isIOS){location.href=web;return}
  let left=false;const onHide=()=>{left=true};
  document.addEventListener('visibilitychange',onHide,{once:true});
  location.href=app;
  setTimeout(()=>{if(!left&&!document.hidden)location.href=web},1400);
}

// várias paradas: só o Google Maps aceita; o link universal abre o app se estiver instalado
function goRoute(stops){
  const ll=s=>s.lat+','+s.lng, last=stops[stops.length-1];
  location.href='https://www.google.com/maps/dir/?api=1&destination='+ll(last)+'&waypoints='+encodeURIComponent(stops.slice(0,-1).map(ll).join('|'))+'&travelmode=driving&dir_action=navigate';
}

// ---------- busca de endereço (Photon / OpenStreetMap) ----------
const q=$('q'),sugg=$('sugg');let tmr=0,ctrl=null;
function photon(text,limit=6){
  if(ctrl)ctrl.abort();ctrl=new AbortController();
  const u='https://photon.komoot.io/api/?limit='+limit+'&lat=-23.55&lon=-46.63&bbox='+SP_BBOX.join(',')+'&q='+encodeURIComponent(text);
  return fetch(u,{signal:ctrl.signal}).then(r=>r.json()).then(j=>j.features.map(f=>{
    const p=f.properties,[lng,lat]=f.geometry.coordinates;
    const main=p.street?(p.street+(p.housenumber?', '+p.housenumber:'')):p.name;
    const label=(p.name&&p.street&&p.name!==p.street)?p.name:main;
    const sub=[p.name&&p.street&&p.name!==p.street?main:'',p.district||p.locality,p.city].filter(Boolean).join(' · ');
    return {lat,lng,label:label||'Local',sub};
  }));
}

// ---------- bolsões fora da Zona Azul (posição por endereço, 1x por aparelho) ----------
function geocodeFora(fora){
  const cache=store.get('foraGeo_v1',{});
  const add=(f,g)=>B.push({lat:g[0],lng:g[1],vagas:f[2],rua:f[0],comp:f[1],area:'',aprox:true});
  const todo=[];
  fora.forEach(f=>{const g=cache[f[3]];if(g&&g!=='x')add(f,g);else if(!g)todo.push(f)});
  let i=0;
  function next(){
    if(i>=todo.length||!navigator.onLine)return;
    const f=todo[i++];
    const key=norm(f[0]).replace(/^(rua|avenida|alameda|praca|estrada)\s+/,'').replace(/^(dr|prof|eng|cel|frei|padre|santa|sao|conselheiro|monsenhor|comendador|barao|almirante|visconde|conego)\.?\s+/,'').split(' ').filter(w=>w.length>3)[0]||'';
    fetch('https://photon.komoot.io/api/?limit=1&bbox='+SP_BBOX.join(',')+'&q='+encodeURIComponent(f[3]))
      .then(r=>r.json()).then(j=>{const ft=j.features[0];
        if(ft&&key&&norm((ft.properties.street||'')+' '+(ft.properties.name||'')).includes(key)){const [lng,lat]=ft.geometry.coordinates;cache[f[3]]=[lat,lng];add(f,[lat,lng])}else cache[f[3]]='x';
        store.set('foraGeo_v1',cache)}).catch(()=>{}).finally(()=>setTimeout(next,1100));
  }
  setTimeout(next,2500);
}


// ---------- painel arrastável ----------
const sheet=$('sheet'), grab=$('grab');
const mobile=()=>innerWidth<760;
function sizes(){const vh=innerHeight, hd=document.querySelector('header').offsetHeight, hc=$('homec');
  const mid=hc?Math.min(Math.round(vh*.42),hc.offsetHeight+26+16+(parseFloat(getComputedStyle(sheet).paddingBottom)||0)):Math.round(vh*.46);
  return {min:110,mid,max:vh-hd-24}}
let sheetState='mid';
function setSheet(s){sheetState=s;if(!mobile()){sheet.style.height='';return}const hh=sizes()[s];sheet.style.height=hh+'px';document.documentElement.style.setProperty('--sh',hh+'px')}
let drag=null;
grab.addEventListener('pointerdown',e=>{if(!mobile())return;grab.setPointerCapture(e.pointerId);drag={y:e.clientY,h:sheet.offsetHeight,moved:0};sheet.classList.add('dragging')});
grab.addEventListener('pointermove',e=>{if(!drag)return;const dy=drag.y-e.clientY;drag.moved=Math.max(drag.moved,Math.abs(dy));const z=sizes();
  const hh=Math.max(z.min,Math.min(z.max,drag.h+dy));sheet.style.height=hh+'px';document.documentElement.style.setProperty('--sh',hh+'px')});
function endDrag(){if(!drag)return;sheet.classList.remove('dragging');const z=sizes(),h=sheet.offsetHeight,moved=drag.moved;drag=null;
  if(moved<6){setSheet(sheetState==='max'?'mid':sheetState==='mid'?'max':'mid');return}
  const best=Object.entries(z).sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];setSheet(best)}
grab.addEventListener('pointerup',endDrag);grab.addEventListener('pointercancel',endDrag);
grab.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet(sheetState==='max'?'mid':'max')}});
addEventListener('resize',()=>setSheet(sheetState));
setSheet('mid');

// ---------- carregar ----------
fetch('bolsoes.json').then(r=>r.json()).then(d=>{
  DATA_DATE=d.atualizado;
  B=d.za.map(z=>({lat:z[0],lng:z[1],vagas:z[2],rua:z[3],comp:z[4],area:z[5]}));
  drawAll();
  geocodeFora(d.fora);
  if(!dest)showHome();
}).catch(()=>{panel.innerHTML='<div class="empty"><h2>Sem conexão</h2><p>Abra o app uma vez com internet para baixar os bolsões.</p></div>'});
showHome();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
