<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolsão Moto</title>
<meta name="description" content="Encontre o bolsão de moto mais perto do seu destino em São Paulo e vá direto para ele.">
<meta name="theme-color" content="#0b4f9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolsão Moto">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#121820; --muted:#5a6573; --line:#d6dbe2;
  --sign:#0b4f9c; --sign-2:#083c78; --sign-fg:#fff; --mark:#f2b705; --mark-fg:#1b1600;
  --pin:#d0142c; --ok:#178a45; --warn:#b26a00; --chip:#e4e9f0;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1016; --surface:#161c24; --fg:#eef2f6; --muted:#9aa5b2; --line:#29313c;
  --sign:#2f7bd6; --sign-2:#1d5aa6; --chip:#1f2732; --ok:#3cc477; --warn:#f0a43a; --pin:#ff4d5e;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit}
.pad{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* topo */
header{background:linear-gradient(180deg,var(--sign),var(--sign-2));color:var(--sign-fg);padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:12px;flex:none;position:relative;z-index:1000}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1}
#near{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:15px;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
#near:active{background:rgba(255,255,255,.3)}
.search{position:relative}
#q{width:100%;font:inherit;font-size:18px;padding:14px 44px 14px 16px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-appearance:none}
#q:focus{outline:3px solid var(--mark)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;max-height:58vh;overflow-y:auto}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-bottom:1px solid var(--line)}
#sugg button:last-child{border-bottom:0}
#sugg small{display:block;color:var(--muted);font-size:14px}
#sugg .hd{padding:10px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* mapa */
#map{flex:1 1 auto;min-height:200px;background:var(--chip);z-index:1}
.leaflet-container{font-family:var(--font)}
.dest-pin{width:30px;height:40px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.bmk{display:grid;place-items:center;border-radius:50%;background:var(--mark);color:var(--mark-fg);font-weight:800;font-size:12px;border:2px solid #1b1600;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bmk.best{background:var(--ok);color:#fff;border-color:#fff;font-size:14px;box-shadow:0 0 0 4px rgba(23,138,69,.35),0 2px 6px rgba(0,0,0,.4)}

/* painel */
#sheet{flex:none;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -6px 24px rgba(0,0,0,.15);margin-top:-18px;position:relative;z-index:900;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);max-height:58vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.dest{font-size:15px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.dest b{color:var(--fg)}
.top{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start}
.top h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.15;font-weight:800;overflow-wrap:anywhere;text-wrap:balance}
.top .sub{grid-column:1;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.vg{grid-row:1/span 2;grid-column:2;background:var(--mark);color:var(--mark-fg);border-radius:12px;text-align:center;padding:6px 10px;min-width:64px}
.vg b{display:block;font-size:26px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.vg span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.walk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.pill{font-size:14px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--chip);font-variant-numeric:tabular-nums}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:var(--ok);color:#fff;font-size:20px;font-weight:800;padding:17px;box-shadow:0 4px 14px rgba(23,138,69,.35)}
.go:active{transform:scale(.985)}
.alts{margin-top:16px;display:grid;gap:8px}
.alt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:none;text-align:left;width:100%}
.alt .t{font-weight:650;overflow-wrap:anywhere}
.alt .s{grid-column:1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.alt .n{grid-row:1/span 2;grid-column:2;font-weight:800;font-size:15px;background:var(--chip);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.empty h2{margin:0 0 6px;font-family:var(--display);font-size:22px;font-weight:800}
.empty p{margin:0 0 12px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 12px;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:14px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:2000;max-width:calc(100% - 32px);text-align:center}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (min-width:760px){
  body{flex-direction:row;flex-wrap:wrap}
  header{width:100%}
  #map{order:2;flex:1 1 0;height:auto}
  #sheet{order:1;width:400px;max-height:none;margin-top:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line)}
  .grab{display:none}
}
</style>
</head>
<body>
<header class="pad">
  <div class="brand"><img src="icon-180.png" alt=""><b>Bolsão Moto</b><button id="near" aria-label="Bolsões perto de mim"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/></svg>Perto de mim</button></div>
  <div class="search">
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" placeholder="Para onde você vai?" aria-label="Destino">
    <button id="clear" aria-label="Limpar" hidden>×</button>
    <div id="sugg" hidden></div>
  </div>
</header>

<div id="map" aria-label="Mapa"></div>

<section id="sheet" class="pad" aria-live="polite">
  <div class="grab"></div>
  <div id="panel"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SP_BBOX=[-46.83,-24.01,-46.36,-23.36];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let B=[];               // bolsões: {lat,lng,vagas,rua,comp,area}
let DATA_DATE='';
let dest=null;          // {lat,lng,label,sub}
let picked=0;           // índice do bolsão escolhido na lista atual
let current=[];         // lista ordenada atual

// ---------- distância ----------
function dist(a,b){const R=6371000,toR=Math.PI/180;const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fmtM=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const walkMin=m=>Math.max(1,Math.round(m*1.3/80)); // fator de trajeto real ≈1,3; 80 m/min

// ---------- mapa ----------
const dark=matchMedia('(prefers-color-scheme: dark)');
const tileUrl=()=>dark.matches?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-23.5505,-46.6333],13);
let tiles=L.tileLayer(tileUrl(),{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);
dark.addEventListener('change',()=>{map.removeLayer(tiles);tiles=L.tileLayer(tileUrl(),{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map)});
const layer=L.layerGroup().addTo(map);
const allLayer=L.layerGroup();
const destIcon=L.divIcon({className:'',html:'<svg class="dest-pin" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25z" fill="#d0142c" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>',iconSize:[30,40],iconAnchor:[15,39]});
const meIcon=L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const bIcon=(n,best)=>{const s=best?40:Math.min(30,18+Math.round(n/5));return L.divIcon({className:'',html:`<div class="bmk${best?' best':''}" style="width:${s}px;height:${s}px">${n}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]})};

// pontos de fundo quando não há destino
function drawAll(){allLayer.clearLayers();B.forEach(b=>L.circleMarker([b.lat,b.lng],{radius:4,color:'#1b1600',weight:1,fillColor:'#f2b705',fillOpacity:.9}).addTo(allLayer));}
map.on('zoomend',()=>{if(!dest){if(map.getZoom()>=14){if(!map.hasLayer(allLayer))allLayer.addTo(map)}else map.removeLayer(allLayer)}});

// ---------- painel ----------
const panel=$('panel');
function recentChips(){
  const r=store.get('recentes',[]);
  return r.length?`<p class="lbl" style="margin-top:14px">Recentes</p><div class="chips">${r.map((d,i)=>`<button class="chip" data-r="${i}">${esc(d.label)}</button>`).join('')}</div>`:'';
}
function showHome(){
  panel.innerHTML=`<div class="empty"><h2>Para onde você vai?</h2>
  <p>Digite o destino e o app mostra o bolsão de moto mais perto, com rota direto para a vaga. Ou toque em <b>Perto de mim</b>.</p></div>
  ${recentChips()}
  <p class="foot">${B.length?B.length.toLocaleString('pt-BR')+' bolsões gratuitos da CET':'Carregando bolsões…'}${DATA_DATE?' · dados de '+DATA_DATE:''}</p>`;
}
panel.addEventListener('click',e=>{
  const r=e.target.closest('[data-r]');if(r){const d=store.get('recentes',[])[+r.dataset.r];if(d)setDest(d);return}
  const a=e.target.closest('[data-alt]');if(a){picked=+a.dataset.alt;render();return}
  if(e.target.closest('#goBtn')){go(current[picked].b);return}
});

function setDest(d,save=true){
  dest=d;$('q').value=d.me?'':d.label;$('clear').hidden=!$('q').value;
  if(save&&!d.me){const r=store.get('recentes',[]).filter(x=>x.label!==d.label);r.unshift({lat:d.lat,lng:d.lng,label:d.label,sub:d.sub||''});store.set('recentes',r.slice(0,6))}
  map.removeLayer(allLayer);
  current=B.map(b=>({b,m:dist(d,b)})).sort((x,y)=>x.m-y.m).slice(0,6);
  picked=0;render(true);
}
function render(fit){
  layer.clearLayers();
  if(!dest||!current.length){showHome();return}
  const d=dest, c=current[picked], b=c.b;
  L.marker([d.lat,d.lng],{icon:d.me?meIcon:destIcon,zIndexOffset:1000}).addTo(layer);
  current.forEach((x,i)=>{const m=L.marker([x.b.lat,x.b.lng],{icon:bIcon(x.b.vagas,i===picked),zIndexOffset:i===picked?900:0}).addTo(layer);m.on('click',()=>{picked=i;render()})});
  L.polyline([[d.lat,d.lng],[b.lat,b.lng]],{color:'#178a45',weight:3,dashArray:'6 8',opacity:.9}).addTo(layer);
  if(fit){const pts=[[d.lat,d.lng],...current.slice(0,3).map(x=>[x.b.lat,x.b.lng])];map.fitBounds(pts,{padding:[50,50],maxZoom:17})}
  const near=c.m<=400, far=c.m>900;
  const where=d.me?'Você está aqui':`Destino: <b>${esc(d.label)}</b>${d.sub?' · '+esc(d.sub):''}`;
  panel.innerHTML=`
  <p class="dest">${where}</p>
  <p class="lbl">${picked===0?'Bolsão mais perto':'Bolsão escolhido'}</p>
  <div class="top"><h2>${esc(b.rua)}</h2><div class="sub">${esc([b.comp,b.area].filter(Boolean).join(' · '))}</div>
    <div class="vg"><b>${b.vagas}</b><span>vagas</span></div></div>
  <div class="walk">
    <span class="pill ${near?'ok':far?'warn':''}">${fmtM(c.m)} ${d.me?'de você':'do destino'}</span>
    ${d.me?'':`<span class="pill">~${walkMin(c.m)} min a pé</span>`}
    ${b.aprox?'<span class="pill warn">posição aproximada</span>':''}
  </div>
  ${far?`<p class="dest">Não há bolsão a até 900 m. Este é o mais perto que a CET lista.</p>`:''}
  <button class="go" id="goBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>Ir para o bolsão</button>
  <div class="alts"><p class="lbl" style="margin:4px 0 0">Outras opções</p>
  ${current.map((x,i)=>i===picked?'':`<button class="alt" data-alt="${i}"><span class="t">${esc(x.b.rua)}</span><span class="s">${fmtM(x.m)} · ${esc(x.b.area||x.b.comp||'')}</span><span class="n">${x.b.vagas} vagas</span></button>`).join('')}
  </div>
  <p class="foot">Distâncias em linha reta. Confira a placa no local. Dados CET${DATA_DATE?' de '+DATA_DATE:''}.</p>`;
}

// ---------- abrir no Google Maps ----------
function go(b){
  const ll=b.lat+','+b.lng;
  const web='https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving&dir_action=navigate';
  const app='comgooglemaps://?daddr='+ll+'&directionsmode=driving';
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!isIOS){location.href=web;return}
  let left=false;const onHide=()=>{left=true};
  document.addEventListener('visibilitychange',onHide,{once:true});
  location.href=app;
  setTimeout(()=>{if(!left&&!document.hidden)location.href=web},1400);
}

// ---------- busca de endereço (Photon / OpenStreetMap) ----------
const q=$('q'),sugg=$('sugg');let tmr=0,ctrl=null;
function photon(text,limit=6){
  if(ctrl)ctrl.abort();ctrl=new AbortController();
  const u='https://photon.komoot.io/api/?limit='+limit+'&lat=-23.55&lon=-46.63&bbox='+SP_BBOX.join(',')+'&q='+encodeURIComponent(text);
  return fetch(u,{signal:ctrl.signal}).then(r=>r.json()).then(j=>j.features.map(f=>{
    const p=f.properties,[lng,lat]=f.geometry.coordinates;
    const main=p.street?(p.street+(p.housenumber?', '+p.housenumber:'')):p.name;
    const label=(p.name&&p.street&&p.name!==p.street)?p.name:main;
    const sub=[p.name&&p.street&&p.name!==p.street?main:'',p.district||p.locality,p.city].filter(Boolean).join(' · ');
    return {lat,lng,label:label||'Local',sub};
  }));
}
function showSugg(list,msg){
  if(!list.length&&!msg){sugg.hidden=true;return}
  sugg.innerHTML=(msg?`<div class="hd">${esc(msg)}</div>`:'')+list.map((s,i)=>`<button data-s="${i}">${esc(s.label)}<small>${esc(s.sub||'')}</small></button>`).join('');
  sugg._list=list;sugg.hidden=false;
}
q.addEventListener('input',()=>{
  $('clear').hidden=!q.value;clearTimeout(tmr);
  const t=q.value.trim();
  if(t.length<3){showSugg(t?[]:store.get('recentes',[]),t?'':'Recentes');return}
  tmr=setTimeout(()=>{photon(t).then(l=>showSugg(l,l.length?'':'Nada encontrado. Tente rua e número.')).catch(e=>{if(e.name!=='AbortError')showSugg([],'Sem conexão para buscar endereço.')})},300);
});
q.addEventListener('focus',()=>{if(!q.value)showSugg(store.get('recentes',[]),'Recentes')});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const l=sugg._list;if(l&&l.length&&!sugg.hidden){pick(l[0])}else if(q.value.trim().length>=3){photon(q.value.trim(),1).then(r=>r[0]?pick(r[0]):toast('Endereço não encontrado.'))}}});
sugg.addEventListener('pointerdown',e=>e.preventDefault());
sugg.addEventListener('click',e=>{const bt=e.target.closest('[data-s]');if(bt)pick(sugg._list[+bt.dataset.s])});
function pick(s){sugg.hidden=true;q.blur();setDest(s)}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sugg.hidden=true});
$('clear').onclick=()=>{q.value='';$('clear').hidden=true;dest=null;current=[];layer.clearLayers();showHome();q.focus();if(map.getZoom()>=14)allLayer.addTo(map)};

// ---------- perto de mim ----------
$('near').onclick=()=>{
  if(!navigator.geolocation){toast('Localização não disponível neste aparelho.');return}
  toast('Buscando sua localização…');
  navigator.geolocation.getCurrentPosition(p=>{
    setDest({lat:p.coords.latitude,lng:p.coords.longitude,label:'Minha localização',me:true},false);
  },err=>{toast(err.code===1?'Permita a localização para o app em Ajustes > Privacidade > Serviços de Localização.':'Não consegui pegar sua localização. Tente de novo.')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
};

let tt=0;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=m;clearTimeout(tt);tt=setTimeout(()=>el.remove(),3200)}

// ---------- bolsões fora da Zona Azul (posição por endereço, 1x por aparelho) ----------
function geocodeFora(fora){
  const cache=store.get('foraGeo_v1',{});
  const add=(f,g)=>B.push({lat:g[0],lng:g[1],vagas:f[2],rua:f[0],comp:f[1],area:'',aprox:true});
  const todo=[];
  fora.forEach(f=>{const g=cache[f[3]];if(g&&g!=='x')add(f,g);else if(!g)todo.push(f)});
  let i=0;
  function next(){
    if(i>=todo.length||!navigator.onLine)return;
    const f=todo[i++];
    const key=norm(f[0]).replace(/^(rua|avenida|alameda|praca|estrada)\s+/,'').replace(/^(dr|prof|eng|cel|frei|padre|santa|sao|conselheiro|monsenhor|comendador|barao|almirante|visconde|conego)\.?\s+/,'').split(' ').filter(w=>w.length>3)[0]||'';
    fetch('https://photon.komoot.io/api/?limit=1&bbox='+SP_BBOX.join(',')+'&q='+encodeURIComponent(f[3]))
      .then(r=>r.json()).then(j=>{const ft=j.features[0];
        if(ft&&key&&norm((ft.properties.street||'')+' '+(ft.properties.name||'')).includes(key)){const [lng,lat]=ft.geometry.coordinates;cache[f[3]]=[lat,lng];add(f,[lat,lng])}else cache[f[3]]='x';
        store.set('foraGeo_v1',cache)}).catch(()=>{}).finally(()=>setTimeout(next,1100));
  }
  setTimeout(next,2500);
}

// ---------- carregar ----------
fetch('bolsoes.json').then(r=>r.json()).then(d=>{
  DATA_DATE=d.atualizado;
  B=d.za.map(z=>({lat:z[0],lng:z[1],vagas:z[2],rua:z[3],comp:z[4],area:z[5]}));
  drawAll();if(map.getZoom()>=14)allLayer.addTo(map);
  geocodeFora(d.fora);
  if(!dest)showHome();
}).catch(()=>{panel.innerHTML='<div class="empty"><h2>Sem conexão</h2><p>Abra o app uma vez com internet para baixar os bolsões.</p></div>'});
showHome();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
